# 评估器配置 — 可按需启用/禁用
evaluators:
  code_correctness:
    enabled: true
    weight: 1.0
    applies_to: [script_complete]
  info_usage:
    enabled: true
    weight: 0.9
    applies_to: [script_complete]
  orchestration:
    enabled: true
    weight: 1.0
    applies_to: [main]
  consistency:
    enabled: true
    weight: 0.8
    applies_to: [consistency_check]

# 清洗器配置
cleaner:
  conflict_resolution: "severity_priority"
  allow_llm_rewrite: true
  max_dependency_depth: 3

# LLM 配置 — 兼容任何 OpenAI 兼容 API（公司内网、vLLM、Ollama 等）
llm:
  base_url: "http://10.123.160.137:30000/v1"
  api_key: "dummy-key"
  model: "Deepseek-V4-Flash"
  temperature: 0.1
  timeout: 120
  max_retries: 3
